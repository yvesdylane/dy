<div id="section-tasks" class="space-y-4">
  <div class="flex items-center gap-2">
    <select id="taskGroupFilter" class="px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
      <option value="">All Groups</option>
      <option value="A">Group A</option>
      <option value="B">Group B</option>
      <option value="C">Group C</option>
    </select>
    <select id="taskStatusFilter" class="px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
      <option value="">All Status</option>
      <option value="open">Open</option>
      <option value="closed">Closed</option>
    </select>
  </div>
  <div id="taskList" class="space-y-2"></div>
</div>

<!-- Grade modal content (hidden, injected by JS) -->
<template id="gradeModalTemplate">
  <h2 class="text-lg font-bold">Grade Submission</h2>
  <div id="gradeInfo" class="text-sm space-y-1"></div>
  <div class="flex gap-2 items-center">
    <input id="gradeMarkInput" type="number" step="0.5" min="0" placeholder="Mark" class="flex-1 px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
    <button id="gradeSaveBtn" class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium">Save</button>
  </div>
  <textarea id="gradeFeedbackInput" placeholder="Feedback (optional)" class="w-full px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50 rows-3"></textarea>
</template>
