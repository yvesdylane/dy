<div id="section-users">
  <!-- Floating search bar overlay -->
  <div id="searchBar" class="hidden fixed inset-x-0 top-0 z-50 bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 p-3 shadow-lg safe-area-top">
    <div class="flex items-center gap-2 max-w-3xl mx-auto">
      <div class="relative flex-1">
        <input id="userSearch" type="text" placeholder="Search name, surname, email…" oninput="debounceSearchUsers()"
          class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50" />
        <svg class="absolute left-2.5 top-3 w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <button onclick="toggleSearch()" class="p-2.5 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
        <svg class="w-5 h-5 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Users tab content -->
  <div id="peopleUsersTab">
    <!-- Search icon + Filters row -->
    <div class="flex items-center gap-2 mb-3">
      <button onclick="toggleSearch()" class="p-2 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors shrink-0">
        <svg class="w-5 h-5 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="flex gap-1.5 overflow-x-auto flex-1 pb-1 scrollbar-hide">
        <select id="filterRole" onchange="loadUsers()" class="px-2 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/50 shrink-0">
          <option value="">All Roles</option>
          <option value="intern">Intern</option>
          <option value="instructor">Instructor</option>
          <option value="admin">Admin</option>
          <option value="super_admin">Super Admin</option>
        </select>
        <select id="filterDept" onchange="loadUsers()" class="px-2 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/50 shrink-0">
          <option value="">All Depts</option>
          <option value="ISM">ISM</option>
          <option value="SWE">SWE</option>
          <option value="CGWD">CGWD</option>
          <option value="EDM">EDM</option>
          <option value="CSN">CSN</option>
          <option value="DBMS">DBMS</option>
          <option value="NWS">NWS</option>
        </select>
        <select id="filterGroup" onchange="loadUsers()" class="px-2 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/50 shrink-0">
          <option value="">All Groups</option>
          <option value="A">A</option>
          <option value="B">B</option>
        </select>
        <select id="filterGender" onchange="loadUsers()" class="px-2 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/50 shrink-0">
          <option value="">All Genders</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
    </div>

    <!-- Pagination (top) -->
    <div id="usersPagination" class="flex items-center justify-between text-sm text-zinc-500 mb-3">
      <span id="usersInfo">0 users</span>
      <div class="flex gap-1">
        <button id="prevPage" onclick="changePage(-1)" class="px-3 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-40 transition-colors" disabled>Prev</button>
        <button id="nextPage" onclick="changePage(1)" class="px-3 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-40 transition-colors" disabled>Next</button>
      </div>
    </div>

    <!-- Users list (cards) -->
    <div id="usersList" class="space-y-2"></div>

    <!-- Floating Add Button (users only) -->
    <button onclick="window.openAddUserModal()" class="fixed bottom-20 right-4 z-40 w-14 h-14 rounded-full bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white shadow-lg flex items-center justify-center transition-colors">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- Codes tab content -->
  <div id="peopleCodesTab" class="hidden">
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm text-zinc-500">Manage registration codes</span>
      <button onclick="openAddCodeModal()" class="px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium transition-colors">+ Generate</button>
    </div>
    <div class="flex items-center gap-2 mb-3">
      <label class="flex items-center gap-1.5 text-xs text-zinc-600 dark:text-zinc-400">
        <input type="checkbox" id="selectAllCodes" class="accent-teal-600"> Select all
      </label>
      <span id="selectedCount" class="text-xs text-zinc-500 hidden"></span>
      <button id="deleteSelectedCodesBtn" class="px-2 py-1 rounded bg-red-500 hover:bg-red-600 text-white text-xs font-medium hidden transition-colors">Delete Selected</button>
      <button id="deleteAllCodesBtn" class="px-2 py-1 rounded border border-red-300 dark:border-red-700 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950 text-xs font-medium transition-colors">Delete All</button>
    </div>
    <div id="codesList" class="space-y-2"></div>
  </div>
</div>
