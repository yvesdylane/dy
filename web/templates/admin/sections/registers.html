<div id="section-registers" class="space-y-4">
  <!-- Registers sub-tab -->
  <div id="attRegistersTab" class="space-y-4">
    <div class="flex items-center gap-2">
      <input id="attDate" type="date" class="flex-1 px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
      <button id="attLoadBtn" class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium transition-colors">Load</button>
      <button id="attSearchBtn" class="px-4 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 text-zinc-600 dark:text-zinc-300 text-sm font-medium transition-colors hover:bg-zinc-100 dark:hover:bg-zinc-800">Search</button>
    </div>
    <div id="attSearchBar" class="hidden">
      <input id="attSearchInput" type="text" placeholder="Filter by name..." class="w-full px-3 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
    </div>
    <div id="attDeptDropdown" class="dept-dropdown relative">
      <button type="button" class="dept-dropdown-toggle px-2 py-1 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs flex items-center gap-1 whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-teal-500/50">
        <span class="dept-dropdown-label">All Departments</span>
        <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dept-dropdown-menu hidden absolute top-full left-0 mt-1 z-50 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg shadow-lg p-2 min-w-[160px] max-h-64 overflow-y-auto">
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="ISM"> ISM</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="SWE"> SWE</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="CGWD"> CGWD</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="EDM"> EDM</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="CSN"> CSN</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="DBMS"> DBMS</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="NWS"> NWS</label>
      </div>
    </div>
    <div id="attGroupBadge" class="hidden text-xs font-medium px-2 py-1 rounded-full bg-teal-100 dark:bg-teal-900/50 text-teal-700 dark:text-teal-300 inline-block"></div>
    <label id="attIncludeInactiveLabel" class="hidden flex items-center gap-1.5 text-xs text-zinc-500">
      <input type="checkbox" id="attIncludeInactive" onchange="loadAttendance()" class="accent-teal-600"> Include inactive
    </label>
    <div id="attStudents" class="space-y-2"></div>
    <div id="attActions" class="hidden flex gap-2">
      <button id="attSaveBtn" class="flex-1 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium transition-colors">Save</button>
      <button id="attCreateBtn" class="flex-1 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium transition-colors">Create</button>
      <button id="attDeleteBtn" class="flex-1 py-2 rounded-lg border border-red-300 dark:border-red-800 text-red-600 dark:text-red-400 text-sm font-medium transition-colors">Delete</button>
    </div>
  </div>

  <!-- Leaves sub-tab -->
  <div id="attLeavesTab" class="hidden space-y-3">
    <div class="flex items-center justify-between">
      <p class="text-xs text-zinc-500">Leave requests from interns</p>
      <select id="leaveStatusFilter" class="px-2 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs focus:outline-none focus:ring-2 focus:ring-teal-500/50">
        <option value="">All</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
    <div id="leavesList" class="space-y-2"></div>
  </div>

  <!-- Pass sub-tab -->
  <div id="attPassTab" class="hidden flex flex-col items-center gap-4 py-4">
    <div class="flex items-center gap-3">
      <select id="passModeSelect" class="px-3 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
        <option value="entry">Entry</option>
        <option value="exit">Exit</option>
      </select>
      <button id="passStartBtn" class="px-6 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium transition-colors">Start</button>
      <button id="passStopBtn" class="px-6 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium hidden transition-colors">Stop</button>
      <button id="passCameraBtn" class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition-colors opacity-50 cursor-not-allowed" disabled title="Coming soon">
        <svg class="w-5 h-5 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </div>
    <p id="passStatus" class="text-xs text-zinc-500"></p>
    <div id="passGrid" class="hidden grid grid-cols-2 gap-2 w-full max-w-md"></div>
  </div>
</div>
