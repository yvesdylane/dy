<div id="section-pass" class="flex flex-col items-center gap-4 py-4">
  <div class="flex items-center gap-3">
    <select id="passModeSelect" class="px-3 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
      <option value="entry">Entry</option>
      <option value="exit">Exit</option>
    </select>
    <button id="passStartBtn" class="px-6 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium transition-colors">Start</button>
    <button id="passStopBtn" class="px-6 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium hidden transition-colors">Stop</button>
    <button id="passCameraBtn" class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition-colors">
      <svg class="w-5 h-5 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>
  <p id="passStatus" class="text-xs text-zinc-500"></p>
  <div id="passGrid" class="hidden grid grid-cols-2 gap-2 w-full max-w-md"></div>
  <div id="passCameraContainer" class="hidden flex-col items-center gap-2 w-full max-w-md">
    <div class="relative w-full">
      <video id="passVideo" autoplay playsinline class="w-full rounded-xl border border-zinc-200 dark:border-zinc-800 bg-black"></video>
      <canvas id="passCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
    </div>
    <div id="passDetectedList" class="w-full space-y-1 text-sm"></div>
    <div class="flex gap-2 w-full">
      <button id="passCameraToggleBtn" class="flex-1 py-2 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-white text-sm font-medium transition-colors">
        <svg class="w-4 h-4 inline-block mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        Flip
      </button>
      <button id="passCameraStopBtn" class="flex-1 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition-colors">Stop Camera</button>
    </div>
  </div>
</div>
