<div id="section-pass" class="flex flex-col items-center gap-4 py-4">
  <div class="flex items-center gap-3">
    <select id="passModeSelect" class="px-3 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
      <option value="entry">Entry</option>
      <option value="exit">Exit</option>
    </select>
    <button id="passStartBtn" class="px-6 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium transition-colors">Start</button>
    <button id="passStopBtn" class="px-6 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium hidden transition-colors">Stop</button>
  </div>
  <p id="passStatus" class="text-xs text-zinc-500"></p>
  <div id="passGrid" class="hidden grid grid-cols-2 gap-2 w-full max-w-md"></div>
  <p class="text-xs text-zinc-400 text-center mt-2">Face scan disabled (512MB RAM limit)</p>
</div>
