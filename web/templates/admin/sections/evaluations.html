<div class="space-y-4">
  <!-- Floating search bar overlay -->
  <div id="evalSearchBar" class="hidden fixed inset-x-0 top-0 z-50 bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 p-3 shadow-lg safe-area-top">
    <div class="flex items-center gap-2 max-w-3xl mx-auto">
      <div class="relative flex-1">
        <input id="evalSearchInput" type="text" placeholder="Search name, surname…" oninput="debounceSearchEvals()"
          class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50" />
        <svg class="absolute left-2.5 top-3 w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <button onclick="toggleEvalSearch()" class="p-2.5 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
        <svg class="w-5 h-5 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <button onclick="toggleEvalSearch()" class="p-2 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors shrink-0">
      <svg class="w-5 h-5 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <input type="date" id="evalDate" class="px-3 py-1.5 text-sm border rounded-lg dark:bg-zinc-800 dark:border-zinc-700">
    <div id="evalDeptDropdown" class="dept-dropdown relative">
      <button type="button" class="dept-dropdown-toggle px-2 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-xs flex items-center gap-1 whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-teal-500/50">
        <span class="dept-dropdown-label">All Departments</span>
        <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dept-dropdown-menu hidden absolute top-full left-0 mt-1 z-50 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg shadow-lg p-2 min-w-[160px] max-h-64 overflow-y-auto">
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="ISM"> ISM</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="SWE"> SWE</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="CGWD"> CGWD</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="EDM"> EDM</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="CSN"> CSN</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="DBMS"> DBMS</label>
        <label class="flex items-center gap-2 px-2 py-1.5 text-xs rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer whitespace-nowrap"><input type="checkbox" class="dept-checkbox accent-teal-600" value="NWS"> NWS</label>
      </div>
    </div>
    <label id="evalIncludeInactive" class="hidden flex items-center gap-1.5 text-xs text-zinc-500 cursor-pointer">
      <input type="checkbox" id="includeInactiveCheck" class="rounded">
      Include inactive
    </label>
  </div>

  <div id="evalPagination" class="flex items-center justify-between text-sm text-zinc-500">
    <span id="evalInfo">0 evaluations</span>
    <div class="flex gap-1">
      <button id="evalPrevPage" onclick="changeEvalPage(-1)" class="px-3 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-40 transition-colors" disabled>Prev</button>
      <button id="evalNextPage" onclick="changeEvalPage(1)" class="px-3 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-40 transition-colors" disabled>Next</button>
    </div>
  </div>

  <div id="evalMissing" class="hidden">
    <div class="bg-amber-50 dark:bg-amber-950 border border-amber-200 dark:border-amber-800 rounded-lg p-3 text-sm">
      <span class="font-semibold">Missing evaluations:</span> <span id="missingCount">0</span>
      <span id="missingList" class="text-zinc-600 dark:text-zinc-400"></span>
    </div>
  </div>

  <div id="evalListView"></div>

  <div class="flex justify-end gap-2">
    <button id="createEvalsBtn" class="px-4 py-2 bg-teal-600 text-white rounded-lg text-sm font-medium hover:bg-teal-700 disabled:opacity-50 hidden">
      Create
    </button>
    <button id="saveAllEvals" class="px-4 py-2 bg-brand-500 text-white rounded-lg text-sm font-medium hover:bg-brand-600 disabled:opacity-50">
      Save All
    </button>
  </div>
</div>
