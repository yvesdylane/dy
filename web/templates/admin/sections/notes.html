<div id="section-notes" class="w-full min-w-0 overflow-x-hidden space-y-4">
  <div id="notesTab">
    <div class="flex items-center gap-2 flex-wrap">
      <select id="notesDeptFilter" onchange="loadNotes()" class="px-3 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
        <option value="">All Departments</option>
        <option value="ISM">ISM</option>
        <option value="SWE">SWE</option>
        <option value="CGWD">CGWD</option>
        <option value="EDM">EDM</option>
        <option value="CSN">CSN</option>
        <option value="DBMS">DBMS</option>
        <option value="NWS">NWS</option>
      </select>
      <input id="notesSearch" type="text" placeholder="Search notes..." oninput="debounceSearchNotes()" class="min-w-0 flex-1 px-3 py-1.5 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/50">
    </div>
    <div id="notesList" class="mt-2 space-y-2"></div>
    <button onclick="openCreateNoteModal()" class="fixed bottom-20 right-5 w-12 h-12 rounded-full bg-teal-600 hover:bg-teal-700 text-white shadow-lg flex items-center justify-center transition-colors z-40">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
</div>
